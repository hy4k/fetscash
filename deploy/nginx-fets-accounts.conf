# FETS Accounts — nginx server block (SPA static hosting)
# 1. Replace server_name with the chosen (sub)domain.
# 2. Copy to /etc/nginx/sites-available/fets-accounts, symlink into sites-enabled, reload nginx.
# 3. Then issue TLS:  certbot --nginx -d <your-domain>

server {
    listen 80;
    server_name accounts.fets.cash;

    root /var/www/fets-accounts;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets — long cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
