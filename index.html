<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FETS Cash — Forum Testing &amp; Educational Services</title>
    <meta name="description" content="Financial dashboard for Forum Testing &amp; Educational Services — Invoicing, Cash Book, Expenses, and Payroll">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#080f0c',
                        surface: '#0f1a14',
                        'surface-elevated': '#15221b',
                        'surface-highlight': '#1b2d24',
                        divider: 'rgba(133, 187, 101, 0.08)',
                        primary: {
                            cochin: '#85bb65',
                            calicut: '#3e5c76',
                        },
                        money: {
                            green: '#85bb65',
                            dark: '#003b1f',
                            gold: '#d4af37',
                            paper: '#e8f5e9',
                        },
                        text: {
                            primary: '#e8f5e9',
                            secondary: '#8ba696',
                            tertiary: '#4a6354',
                            muted: '#2d4a3a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        engraved: ['Cinzel Decorative', 'cursive'],
                        serif: ['Rye', 'serif'],
                    },
                    boxShadow: {
                        'neo-flat': '6px 6px 14px #050a08, -6px -6px 14px #162820',
                        'neo-pressed': 'inset 5px 5px 10px #050a08, inset -5px -5px 10px #162820',
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.45)',
                        'glow-green': '0 0 20px rgba(133, 187, 101, 0.15)',
                        'glow-gold': '0 0 20px rgba(212, 175, 55, 0.2)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                        'pulse-slow': 'pulseSlow 3s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(16px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseSlow: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.7' },
                        },
                    }
                }
            }
        }
    </script>
    <!-- Fonts and Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&family=Rye&display=swap" rel="stylesheet">

    <style>
        html, body, #root {
            height: 100%;
        }
        body {
            background-color: #080f0c;
            color: #e8f5e9;
            font-family: 'Inter', system-ui, sans-serif;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 20% 0%, rgba(133,187,101,0.04) 0%, transparent 40%),
                radial-gradient(circle at 80% 100%, rgba(62,92,118,0.06) 0%, transparent 40%);
        }

        /* Subtle noise overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        /* Glass panel */
        .glass-panel {
            background: rgba(21, 34, 27, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(133, 187, 101, 0.10);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-panel:hover {
            border-color: rgba(133, 187, 101, 0.18);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        /* Neomorphism Button */
        .neo-btn {
            background: #15221b;
            box-shadow: 5px 5px 10px #080e0b, -5px -5px 10px #22362c;
            border: 1px solid rgba(133, 187, 101, 0.06);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .neo-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(133,187,101,0.08) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .neo-btn:hover::after { opacity: 1; }
        .neo-btn:active {
            box-shadow: inset 4px 4px 8px #080e0b, inset -4px -4px 8px #22362c;
            transform: translateY(1px);
        }
        .neo-btn:hover {
            box-shadow: 7px 7px 14px #080e0b, -7px -7px 14px #22362c;
            transform: translateY(-1px);
            border-color: rgba(133, 187, 101, 0.12);
        }
        .neo-btn.active {
             box-shadow: inset 4px 4px 8px #080e0b, inset -4px -4px 8px #22362c;
             color: #85bb65;
             border-color: rgba(133, 187, 101, 0.25);
        }

        /* Input */
        .neo-input {
            background: #101b15;
            box-shadow: inset 3px 3px 6px #060a08, inset -3px -3px 6px #1a2c22;
            border: none;
            color: #e8f5e9;
            transition: all 0.3s ease;
        }
        .neo-input:focus {
            box-shadow: inset 5px 5px 10px #060a08, inset -5px -5px 10px #1a2c22;
            outline: none;
            border: 1px solid rgba(133, 187, 101, 0.25);
        }
        .neo-input::placeholder {
            color: #2d4a3a;
        }

        /* Engraved text */
        .engraved-text {
            font-family: 'Cinzel Decorative', cursive;
            background: linear-gradient(to bottom, #cfc09f 22%, #634f2c 24%, #cfc09f 26%, #cfc09f 27%, #ffecb3 40%, #3a2c0f 78%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #fff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(133,187,101,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(133,187,101,0.35); }

        /* Chart tooltip */
        .recharts-tooltip-cursor { fill: rgba(133, 187, 101, 0.04) !important; }

        /* Page transitions */
        .page-enter { animation: fadeIn 0.35s ease-out forwards; }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(133,187,101,0.05) 25%, rgba(133,187,101,0.12) 50%, rgba(133,187,101,0.05) 75%);
            background-size: 200% 100%;
            animation: skeleton 1.5s ease-in-out infinite;
        }
        @keyframes skeleton {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Safe area for mobile bottom nav */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.84.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^11.0.8"
  }
}
</script>

</head>
<body class="h-full antialiased selection:bg-money-green/25 selection:text-white">
    <div id="root" class="h-full flex flex-col sm:flex-row"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
